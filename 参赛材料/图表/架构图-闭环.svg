<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/></marker></defs>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="40" y="42" font-size="22" font-weight="700" fill="#1a1a1a" text-anchor="start" opacity="1.0">核心调度闭环</text>
<text x="40" y="66" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" opacity="1.0">第 5–7 步是整个系统的灵魂：没有真实结果反馈，系统只能采信自我宣称</text>
<rect x="40" y="108" width="176" height="108" rx="10" fill="#eaf2ff" stroke="#1f6feb" stroke-width="2"/>
<text x="64" y="138" font-size="20" font-weight="700" fill="#1f6feb" text-anchor="start" opacity="1.0">①</text>
<text x="136.0" y="140" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">提交任务</text>
<text x="128.0" y="166" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">声明所需能力</text>
<text x="128.0" y="185" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">（如 research）</text>
<rect x="230" y="108" width="176" height="108" rx="10" fill="#eaf2ff" stroke="#1f6feb" stroke-width="2"/>
<text x="254" y="138" font-size="20" font-weight="700" fill="#1f6feb" text-anchor="start" opacity="1.0">②</text>
<text x="326.0" y="140" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">取出候选</text>
<text x="318.0" y="166" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">所有已注册智能体</text>
<text x="318.0" y="185" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">及其历史战绩</text>
<rect x="420" y="108" width="176" height="108" rx="10" fill="#e8f5ec" stroke="#238636" stroke-width="2"/>
<text x="444" y="138" font-size="20" font-weight="700" fill="#238636" text-anchor="start" opacity="1.0">③</text>
<text x="516.0" y="140" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">计算三项分</text>
<text x="508.0" y="166" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">能力匹配度</text>
<text x="508.0" y="185" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">可信度 · 延迟分</text>
<rect x="610" y="108" width="176" height="108" rx="10" fill="#e8f5ec" stroke="#238636" stroke-width="2"/>
<text x="634" y="138" font-size="20" font-weight="700" fill="#238636" text-anchor="start" opacity="1.0">④</text>
<text x="706.0" y="140" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">策略选出最优</text>
<text x="698.0" y="166" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">综合分排序</text>
<text x="698.0" y="185" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">返回被选中者</text>
<rect x="610" y="276" width="176" height="108" rx="10" fill="#fdeceb" stroke="#f85149" stroke-width="2"/>
<text x="634" y="306" font-size="20" font-weight="700" fill="#f85149" text-anchor="start" opacity="1.0">⑤</text>
<text x="706.0" y="308" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">上报真实结果</text>
<text x="698.0" y="334" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">成功/失败</text>
<text x="698.0" y="353" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">实际耗时</text>
<rect x="420" y="276" width="176" height="108" rx="10" fill="#fdeceb" stroke="#f85149" stroke-width="2"/>
<text x="444" y="306" font-size="20" font-weight="700" fill="#f85149" text-anchor="start" opacity="1.0">⑥</text>
<text x="516.0" y="308" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">更新战绩</text>
<text x="508.0" y="334" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">成功次数/失败次数</text>
<text x="508.0" y="353" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">实测平均延迟</text>
<rect x="230" y="276" width="176" height="108" rx="10" fill="#fdf3e3" stroke="#9e6a03" stroke-width="2"/>
<text x="254" y="306" font-size="20" font-weight="700" fill="#9e6a03" text-anchor="start" opacity="1.0">⑦</text>
<text x="326.0" y="308" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle" opacity="1.0">可信度变化</text>
<text x="318.0" y="334" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">影响下一轮调度</text>
<text x="318.0" y="353" font-size="11.5" font-weight="400" fill="#6b7280" text-anchor="middle" opacity="1.0">系统就此「学习」</text>
<line x1="216" y1="162.0" x2="230" y2="162.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="406" y1="162.0" x2="420" y2="162.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="596" y1="162.0" x2="610" y2="162.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="698.0" y1="216" x2="698.0" y2="276" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="610" y1="330.0" x2="596" y2="330.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="420" y1="330.0" x2="406" y2="330.0" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 318.0 384 L 318.0 410 L 100 410 L 100 250" fill="none" stroke="#1f6feb" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow-blue)"/>
<text x="290" y="430" font-size="12.5" font-weight="700" fill="#1f6feb" text-anchor="start" opacity="1.0">回到第 ② 步 —— 自此形成闭环，系统的判断随真实表现持续修正</text>
</svg>